[package]
name = "gs-server"
description = "Pipeline thread, loopback HTTP + LAN HTTPS listeners and WebSocket broadcast for Splat Live"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "gs_server"
path = "src/lib.rs"

[[bin]]
name = "gs-server"
path = "src/main.rs"

[features]
default = []
# Compile the web build (`crates/gs-app/dist`, or the directory named by the
# `GS_DIST_DIR` environment variable at build time) into the binary. Used by
# the Tauri shell and for a single-file headless server. Without a built
# frontend the feature still compiles and the server falls back to its
# placeholder page.
embed-dist = []

[dependencies]
gs-core = { workspace = true, features = ["par"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio", "ws", "json", "query"] }
# `ring` rather than the default aws-lc-rs: no C toolchain surprises when the
# Tauri app is cross-built, and rcgen signs with ring as well.
axum-server = { version = "0.9.2", features = ["tls-rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = "0.14.10"
pem = "4"
time = "0.3"
ring = "0.17"
tower-http = { version = "0.7.1", features = ["cors", "compression-gzip", "compression-br"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
if-addrs = "0.15"
# Same version as axum's WebSocket layer, only to recognise its errors.
tungstenite = { version = "0.29", default-features = false }
bytes = "1"
socket2 = "0.6"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
mime_guess = "2"
percent-encoding = "2"
log = { version = "0.4", features = ["std"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["io-util"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tempfile = "3"
flate2 = "1"
