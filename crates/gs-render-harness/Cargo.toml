[package]
name = "gs-render-harness"
description = "Trunk test page for gs-render: GPU vs CPU comparison, live layer, WebXR and performance checks"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
gs-core.workspace = true
gs-render.workspace = true
glam.workspace = true

# The page only exists in the browser; on other targets the binary is a stub
# so that `cargo build` at the workspace root keeps working.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
workspace = true
features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlButtonElement",
  "CanvasRenderingContext2d", "ImageData", "Location", "UrlSearchParams", "Performance",
  "console", "Event", "EventTarget", "MouseEvent", "CssStyleDeclaration",
]
