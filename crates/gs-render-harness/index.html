<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gs-render harness</title>
    <style>
      html, body { margin: 0; height: 100%; background: #101418; color: #e8e8e8; font: 13px system-ui, sans-serif; }
      /* Full-window canvas; the compare test gives it a fixed size instead. */
      #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      /* Above the container WebXR emulators move the canvas into (z-index 999). */
      #hud { position: fixed; left: 12px; top: 12px; z-index: 1000; display: flex; gap: 12px; align-items: center; }
      #enter-vr { display: none; padding: 8px 14px; font-size: 15px; }
      #status { background: rgba(0, 0, 0, 0.55); padding: 4px 8px; border-radius: 4px; }
      #results { padding: 48px 12px 12px; }
      .case { margin-bottom: 14px; }
      .case p { margin: 0 0 4px; }
      .case canvas { margin-right: 6px; border: 1px solid #333; }
    </style>
    <link data-trunk rel="rust" data-wasm-opt="2" />
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="hud">
      <button id="enter-vr" disabled>Checking VR...</button>
      <span id="status">starting</span>
    </div>
    <div id="results"></div>
  </body>
</html>
