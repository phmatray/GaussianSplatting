[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]
# The desktop shell needs the system WebKitGTK libraries and is built on
# demand (`cargo build -p splat-live`, see src-tauri/README.md); a plain
# `cargo build` or `cargo test` at the root leaves it out.
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
gs-core = { path = "crates/gs-core" }
glam = { version = "0.34", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.25", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1.1"
rayon = "1.12"
png = "0.18"
# Browser-side crates (wasm32). wasm-bindgen and web-sys are pinned: the
# wasm-bindgen CLI used by Trunk must match exactly, and the WebXR bindings
# (behind `--cfg=web_sys_unstable_apis`, see .cargo/config.toml) may change
# between web-sys releases.
gs-render = { path = "crates/gs-render" }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
web-sys = "=0.3.107"
console_error_panic_hook = "0.1.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# Ray casting and rasterization are unusably slow unoptimized; keep tests fast.
[profile.dev.package.gs-core]
opt-level = 2
[profile.test.package.gs-core]
opt-level = 2
[profile.dev.package."*"]
opt-level = 1
