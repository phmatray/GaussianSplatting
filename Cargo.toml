[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
gs-core = { path = "crates/gs-core" }
glam = { version = "0.34", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.25", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1.1"
rayon = "1.12"
png = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# Ray casting and rasterization are unusably slow unoptimized; keep tests fast.
[profile.dev.package.gs-core]
opt-level = 2
[profile.test.package.gs-core]
opt-level = 2
[profile.dev.package."*"]
opt-level = 1
